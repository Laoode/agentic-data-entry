[project]
name = "klaudia-embed"
version = "0.1.0"
description = "Isolated OpenAI-compatible embedding service for Klaudia memory (mem0 embedder backend)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

# The model runtime is an optional extra so the HTTP contract can be installed
# and unit-tested WITHOUT pulling torch. Install for real serving:
#   uv pip install 'klaudia-embed[model]'
[project.optional-dependencies]
model = ["sentence-transformers>=3.0.0"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "httpx>=0.27.0",
    "ruff>=0.11.0",
]

[tool.setuptools]
packages = ["embed"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "real_model: loads the real sentence-transformers model (slow, downloads weights)",
]
