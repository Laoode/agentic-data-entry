# Distractor column: each row carries a "No Struk" (receipt reference number)
# that looks like an amount but is not money. The expense total is the Jumlah
# column only (1425000). An agent that sums every number - or the wrong column -
# lands on the sum-everything trap (Jumlah + No Struk = 6511549). Data is
# generated by tests/e2e/synthetic.py::build_distractor_ledger at seed 1013 and
# seeded under scratch user 90102 by tests/e2e/test_synthetic_bench_e2e.py.
#
# contains_amount is digit-normalized; the golden test asserts the correct total
# is not a digit-substring of the trap, so a reply stating only the trap fails.
# tests/unit/test_synthetic_ledger.py::test_distractor_golden_seed_1013_is_frozen
# guards the frozen totals.

- id: DISTRACT01-reference-number-not-summed
  category: distractor_column
  title: Expense total sums Jumlah, not the No Struk reference column
  tags: [distractor_column, synthetic, numeric, schema]
  turns:
    - user: "Berapa total pengeluaran di sheet Transaksi Juni?"
      as_user: 90102
      note: "Correct = Jumlah column = 1425000. Naive sum-everything = 6511549."
      expect:
        route: data_entry_team
        mcp_tools_any: [tool_get_sheet_data, tool_get_multiple_sheet_data]
        contains_amount: ["1425000"]
        content_none: ["workspace", "spreadsheet_id", "tool_"]
