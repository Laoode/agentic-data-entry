# Hostile / realistic schema: a receipt-style sheet with three numeric columns
# (Qty, Harga Satuan, Nominal). The expense is the line total Nominal
# (= Qty x Harga Satuan), NOT the unit price and NOT the quantity. A weak agent
# sums Harga Satuan (541000) or every number (1614028); the correct expense is
# 1073000. Data is generated by tests/e2e/synthetic.py::build_hostile_schema_ledger
# at seed 1013 and seeded under scratch user 90108 by test_synthetic_bench_e2e.py.
# tests/unit/test_synthetic_ledger.py::test_hostile_schema_is_frozen guards it.

- id: HOSTILE01-line-total-not-unit-price
  category: hostile_schema
  title: Sum the line-total column, not the unit price or quantity
  tags: [hostile_schema, synthetic, numeric, schema]
  turns:
    - user: "Berapa total pengeluaran belanja di sheet Belanja Toko?"
      as_user: 90108
      note: "Expense = Nominal column = 1073000 (traps: Harga Satuan 541000, all 1614028)."
      expect:
        route: data_entry_team
        mcp_tools_any: [tool_get_sheet_data, tool_get_multiple_sheet_data]
        contains_amount: ["1073000"]
        content_none: ["workspace", "spreadsheet_id", "tool_"]
