# Dirty-data aggregation: amounts appear in mixed Indonesian/English/Rp formats
# within a single sheet (e.g. "295.000", "130,000", "Rp 1.203.000", "43000"). A
# correct agent parses each format and sums; a naive one that assumes a single
# separator convention misreads the total. This is the discriminator - the data
# is generated by tests/e2e/synthetic.py::build_dirty_ledger at seed 1013 and
# seeded under scratch user 90101 by tests/e2e/test_synthetic_bench_e2e.py.
#
# Targets are grounded totals (per-sheet and cross-sheet), which the numeric
# verifier grounds under any mode; grading stays deterministic contains_amount.
# tests/unit/test_synthetic_ledger.py::test_dirty_golden_seed_1013_is_frozen
# guards the frozen amounts below.

- id: DIRTY01-single-sheet-mixed-formats
  category: dirty_data
  title: Exact total of one sheet whose amounts use mixed number formats
  tags: [dirty_data, synthetic, numeric, robustness]
  turns:
    - user: "Berapa total pengeluaran di sheet Belanja Juni?"
      as_user: 90101
      note: "Amounts mix dotted/comma/Rp/plain; correct sum is 959000."
      expect:
        route: data_entry_team
        mcp_tools_any: [tool_get_sheet_data, tool_get_multiple_sheet_data]
        contains_amount: ["959000"]
        content_none: ["workspace", "spreadsheet_id", "tool_"]

- id: DIRTY02-cross-sheet-mixed-formats
  category: dirty_data
  title: Exact cross-sheet total over mixed-format amounts
  tags: [dirty_data, synthetic, numeric, robustness, cross_sheet]
  turns:
    - user: "Total semua pengeluaran dari sheet Belanja Juni dan Belanja Juli berapa?"
      as_user: 90101
      note: "Read both sheets, parse mixed formats, sum. 959000 + 2209000 = 3168000."
      expect:
        route: data_entry_team
        mcp_tools_any: [tool_get_sheet_data, tool_get_multiple_sheet_data]
        contains_amount: ["3168000"]
        content_none: ["workspace", "spreadsheet_id", "tool_"]
