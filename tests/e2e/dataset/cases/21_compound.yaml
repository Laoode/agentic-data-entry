# Multi-step compound (real-user workflow): write new transactions, then
# re-aggregate including them, with cross-turn references ("sheet yang sama").
# The source sheet "Kas Harian" (12 rows, base total 2461000, Makan 1070000) is
# generated by tests/e2e/synthetic.py::build_compound_ledger at seed 1013 and
# seeded under scratch user 90107 by tests/e2e/test_synthetic_bench_e2e.py, which
# re-seeds it before each mutating case so appends never leak between cases.
#
# Grading is on the END STATE total: if any append lands wrong (category, amount)
# or the final sum drifts, the exact-match check fails. Frozen truth guarded by
# tests/unit/test_synthetic_ledger.py::test_compound_source_is_frozen.

- id: COMPOUND01-write-write-then-total
  category: compound
  title: Two appends across turns, then the grand total reflects both
  tags: [compound, synthetic, numeric, multi_turn, mutating]
  mutating: true
  turns:
    - user: "Tolong catat pengeluaran baru: GoFood, kategori Makan, Rp175.000, di sheet Kas Harian."
      as_user: 90107
      expect:
        route: data_entry_team
        mcp_tools_any: [tool_append_rows, tool_update_cells]
    - user: "Catat juga yang ini di sheet yang sama ya: Grab, kategori Transport, Rp90.000."
      as_user: 90107
      note: "Cross-turn reference: 'sheet yang sama' = Kas Harian."
      expect:
        route: data_entry_team
        mcp_tools_any: [tool_append_rows, tool_update_cells]
    - user: "Sekarang total keseluruhan pengeluaran di sheet Kas Harian jadi berapa?"
      as_user: 90107
      note: "Base 2461000 + 175000 + 90000 = 2726000. Must include both new rows."
      expect:
        route: data_entry_team
        mcp_tools_any: [tool_get_sheet_data, tool_get_multiple_sheet_data]
        contains_amount: ["2726000"]
        content_none: ["workspace", "spreadsheet_id", "tool_"]

- id: COMPOUND02-write-then-category-total
  category: compound
  title: Append lands in the right category, then the category total reflects it
  tags: [compound, synthetic, numeric, multi_turn, mutating]
  mutating: true
  turns:
    - user: "Catat pengeluaran: Shopee, kategori Makan, Rp200.000, di sheet Kas Harian."
      as_user: 90107
      expect:
        route: data_entry_team
        mcp_tools_any: [tool_append_rows, tool_update_cells]
    - user: "Total pengeluaran kategori Makan di Kas Harian sekarang jadi berapa?"
      as_user: 90107
      note: "Makan base 1070000 + 200000 = 1270000."
      expect:
        route: data_entry_team
        mcp_tools_any: [tool_get_sheet_data, tool_get_multiple_sheet_data]
        contains_amount: ["1270000"]
        content_none: ["workspace", "spreadsheet_id", "tool_"]
