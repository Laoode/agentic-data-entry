# Reconciliation: the Rangkuman sheet states a Juli total that is wrong (off by
# 137000 from the detail). A correct agent recomputes from the detail rather than
# trusting the summary, reports the correct total (2252000) and the discrepancy
# (137000). An agent that parrots the summary states 2389000 and fails. Data is
# generated by tests/e2e/synthetic.py::build_reconciliation_ledger at seed 1013
# and seeded under scratch user 90105 by tests/e2e/test_synthetic_bench_e2e.py.
# tests/unit/test_synthetic_ledger.py::test_reconciliation_golden_seed_1013_is_frozen
# guards the frozen figures.

- id: RECON01-summary-mismatch
  category: reconciliation
  title: Catch the wrong summary total by recomputing from the detail
  tags: [reconciliation, synthetic, numeric, verification]
  turns:
    - user: "Di sheet Rangkuman tertulis total Juli. Tolong cek apakah cocok dengan detail di sheet Pengeluaran Juli. Kalau tidak cocok, berapa total yang benar dan berapa selisihnya?"
      as_user: 90105
      note: "Detail = 2252000; Rangkuman says 2389000; selisih 137000. Must verify."
      expect:
        route: data_entry_team
        mcp_tools_any: [tool_get_sheet_data, tool_get_multiple_sheet_data]
        contains_amount: ["2252000", "137000"]
        content_none: ["workspace", "spreadsheet_id", "tool_"]
