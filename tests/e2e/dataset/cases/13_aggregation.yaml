# Precise cross-sheet aggregation over a synthetic ledger (deterministic ground
# truth). The data is generated by tests/e2e/synthetic.py at seed 1013 and seeded
# into a scratch user's spreadsheet by tests/e2e/test_aggregation_e2e.py; the
# amounts below are that generator's exact code-computed totals, frozen here.
# tests/unit/test_synthetic_ledger.py::test_golden_seed_1013_is_frozen guards the
# freeze - if the generator drifts, that unit test fails before these do.
#
# Grading is deterministic (digit-normalized contains_amount); no LLM judge. The
# numeric verifier already grounds column sums, per-category group-by sums, and
# the cross-sheet total, so a correct agent can legitimately state each figure.
# All turns run as a scratch user (90100) whose spreadsheet holds ONLY the two
# synthetic sheets, so these never touch the docs/TABLE.md bench baseline.

- id: AGG01-single-sheet-total
  category: aggregation
  title: Exact total of one synthetic sheet (Pengeluaran Juni)
  tags: [aggregation, synthetic, numeric]
  turns:
    - user: "Berapa total pengeluaran di sheet Pengeluaran Juni?"
      as_user: 90100
      note: "Column sum of the Jumlah column in one sheet; exact match required."
      expect:
        route: data_entry_team
        mcp_tools_any: [tool_get_sheet_data, tool_get_multiple_sheet_data]
        contains_amount: ["1943000"]
        content_none: ["workspace", "spreadsheet_id", "tool_"]

- id: AGG02-cross-sheet-total
  category: aggregation
  title: Exact total across both synthetic sheets (Juni + Juli)
  tags: [aggregation, synthetic, numeric, cross_sheet]
  turns:
    - user: "Total semua pengeluaran dari sheet Pengeluaran Juni dan Pengeluaran Juli berapa?"
      as_user: 90100
      note: "Must read both sheets and sum. 1943000 + 1659000 = 3602000."
      expect:
        route: data_entry_team
        mcp_tools_any: [tool_get_sheet_data, tool_get_multiple_sheet_data]
        contains_amount: ["3602000"]
        content_none: ["workspace", "spreadsheet_id", "tool_"]

- id: AGG03-category-rollup
  category: aggregation
  title: Exact per-category rollup across sheets (Makan)
  tags: [aggregation, synthetic, numeric, group_by]
  turns:
    - user: "Total pengeluaran kategori Makan dari semua sheet berapa?"
      as_user: 90100
      note: "Group-by category summed across both sheets; exact match required."
      expect:
        route: data_entry_team
        mcp_tools_any: [tool_get_sheet_data, tool_get_multiple_sheet_data]
        contains_amount: ["1523000"]
        content_none: ["workspace", "spreadsheet_id", "tool_"]
