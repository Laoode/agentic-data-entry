# Cross-session memory. Turns use `new_session: true` to force a fresh session
# (empty conversation window), so anything recalled must come from long-term
# memory (mem0) or deterministic continuity state, NOT the history window.
#
# Two tiers here:
#   - MEM01 (continuity) and MEM03 (anti-confabulation) need only the ledger /
#     empty context; they run whenever the e2e runs.
#   - Cases tagged `needs_memory` require mem0 enabled (MEMORY_MODE + embed
#     service). test_memory_e2e.py skips them when container.memory is None.
#
# The harness flushes background memory writes before each new-session turn, so a
# write in session A is durable before session B recalls it (deterministic).

- id: MEM01-continuity-last-sheet
  category: memory
  title: A fresh session recalls the last edited sheet (deterministic, no mem0)
  tags: [memory, continuity, cross_session]
  mutating: true
  turns:
    - user: "Catat pengeluaran Indomaret 152000 hari ini di sheet Jun."
      expect:
        route: data_entry_team
        mcp_tools_any: [tool_append_rows, tool_update_cells]
    - user: "Kita terakhir ngerjain di sheet mana ya?"
      new_session: true
      note: "New session, empty window. Answer from continuity state (updated_at)."
      expect:
        route_any_of: [none, data_entry_team]
        content_any: ["jun"]
        content_none: ["session", "workspace", "recent_activity", "tool_"]

- id: MEM03-no-memory-confabulation
  category: memory
  title: Empty memory must be admitted, never fabricated (finance-critical)
  tags: [memory, negative, anti_confab]
  turns:
    - user: "Lanjutin transaksi yang kemarin dong."
      new_session: true
      as_user: 90003
      note: "Brand-new user, nothing on record. Must ask, not invent a past entry."
      expect:
        is_clarification: true
        content_none: ["indomaret", "alfamart", "gofood"]

- id: MEM02-preference-recall
  category: memory
  title: A preference stated in one session is applied in a later session
  tags: [memory, preference, cross_session, needs_memory]
  turns:
    - user: "Tolong diingat ya, pengeluaran GoFood selalu masuk kategori Transport."
      as_user: 90010
      expect:
        route_any_of: [none, data_entry_team]
    - user: "Kalau GoFood itu masuk kategori apa menurut catatanku?"
      new_session: true
      as_user: 90010
      note: "Fresh session. The category must come from long-term memory."
      expect:
        content_any: ["transport"]

- id: MEM05-preference-latest-wins
  category: memory
  title: A corrected preference overrides the old one (mem0 conflict resolution)
  tags: [memory, preference, conflict, needs_memory]
  turns:
    - user: "Ingat ya, GoFood masuk kategori Transport."
      as_user: 90011
      expect:
        route_any_of: [none, data_entry_team]
    - user: "Eh maaf salah, mulai sekarang GoFood itu kategori Makan ya, bukan Transport."
      new_session: true
      as_user: 90011
      expect:
        route_any_of: [none, data_entry_team]
    - user: "Jadi GoFood kategorinya apa sekarang?"
      new_session: true
      as_user: 90011
      note: >
        Latest correction wins: the current category must be Makan. We assert
        only content_any [makan] (not content_none [transport]): a correct answer
        legitimately references the old value when explaining the change
        ("sekarang Makan, sebelumnya Transport"), so forbidding "transport" would
        reject a good reply.
      expect:
        content_any: ["makan"]

- id: MEM04-cross-user-isolation
  category: memory
  title: One user cannot recall another user's memory (leak rate must be 0)
  tags: [memory, security, tenancy, needs_memory]
  turns:
    - user: "Tolong diingat, toko langganan saya itu Indomaret."
      as_user: 90020
      expect:
        route_any_of: [none, data_entry_team]
    - user: "Toko langganan saya apa ya?"
      new_session: true
      as_user: 90021
      note: "Different user. Must NOT surface user 90020's Indomaret memory."
      expect:
        content_none: ["indomaret"]
