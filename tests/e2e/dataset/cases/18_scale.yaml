        content_none: ["workspace", "spreadsheet_id", "tool_"]

- id: SCALE04-single-sheet-category-at-scale
  category: scale
  title: Exact category total in one sheet of 80 rows (verifier-grounded)
  tags: [scale, synthetic, numeric, group_by]
  turns:
    - user: "Berapa total pengeluaran kategori Makan di sheet Transaksi Besar Juli saja?"
      as_user: 90104
