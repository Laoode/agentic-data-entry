# Scale: 160 mixed-format rows across two sheets. Summing correctly means adding
# ~160 messy numbers exactly - the regime where reasoning-only arithmetic slips.
# Data is generated by tests/e2e/synthetic.py::build_scale_ledger at seed 1013 and
# seeded under scratch user 90104 by tests/e2e/test_synthetic_bench_e2e.py.
# tests/unit/test_synthetic_ledger.py::test_scale_golden_seed_1013_is_frozen
# guards the frozen total.

- id: SCALE01-large-cross-sheet-total
  category: scale
  title: Exact cross-sheet total over 160 mixed-format rows
  tags: [scale, synthetic, numeric, cross_sheet, robustness]
  turns:
    - user: "Total semua pengeluaran dari sheet Transaksi Besar Juni dan Transaksi Besar Juli berapa?"
      as_user: 90104
      note: "160 rows, mixed formats. 20263000 + 21233000 = 41496000. Exact match."
      expect:
        route: data_entry_team
        mcp_tools_any: [tool_get_sheet_data, tool_get_multiple_sheet_data]
        contains_amount: ["41496000"]
        content_none: ["workspace", "spreadsheet_id", "tool_"]

- id: SCALE02-argmax-category-at-scale
  category: scale
  title: Largest category over 160 rows (group-by + ranking + exact total)
  tags: [scale, synthetic, numeric, ranking]
  turns:
    - user: "Dari sheet Transaksi Besar Juni dan Transaksi Besar Juli, kategori pengeluaran mana yang totalnya paling besar, dan berapa totalnya?"
      as_user: 90104
      note: "Group 160 rows by category, rank, and total. Makan wins at 14140000."
      expect:
        route: data_entry_team
        mcp_tools_any: [tool_get_sheet_data, tool_get_multiple_sheet_data]
        content_any: ["makan"]
        contains_amount: ["14140000"]
        content_none: ["workspace", "spreadsheet_id", "tool_"]

- id: SCALE03-filtered-sum-at-scale
  category: scale
  title: Sum only transactions above a threshold over 160 rows (filter + exact sum)
  tags: [scale, synthetic, numeric, filter]
  turns:
