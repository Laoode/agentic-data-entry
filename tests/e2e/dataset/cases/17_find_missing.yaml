# Find-missing-value (anti-confabulation): exactly one row has a blank Jumlah,
# and that row carries a store name ("Apotek Sehat") used nowhere else, so a
# correct answer identifies it unambiguously. A weak agent either misses the gap,
# claims everything is complete, or invents an amount. Data is generated by
# tests/e2e/synthetic.py::build_missing_value_ledger at seed 1013 and seeded under
# scratch user 90103 by tests/e2e/test_synthetic_bench_e2e.py.
# tests/unit/test_synthetic_ledger.py::test_missing_golden_seed_1013_is_frozen
# guards the frozen identity.

- id: FIND01-identify-blank-amount
  category: find_missing
  title: Identify the transaction whose amount is blank, without inventing one
  tags: [find_missing, synthetic, anti_confab]
  turns:
    - user: "Coba cek sheet Catatan Juni, ada transaksi yang jumlahnya belum diisi nggak? Kalau ada, dari toko mana?"
      as_user: 90103
      note: "Exactly one blank amount, on the unique store 'Apotek Sehat'."
      expect:
        route: data_entry_team
        mcp_tools_any: [tool_get_sheet_data, tool_get_multiple_sheet_data]
        content_any: ["apotek sehat"]
        content_none: ["workspace", "spreadsheet_id", "tool_"]
