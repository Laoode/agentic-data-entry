# KIE / Extraction (real vLLM, MOCK_KIE=false). Cache hit/miss is asserted from
# the ExtractionAgent result (cache_hits / cache_misses), NOT latency — this
# mirrors the extraction_agent.process output in Langfuse.
#
# Sample content (from sample-data/labels/images/*.json):
#   001-receipt.jpeg → ALFAMIDI, 1 item, total 10.800   (already ingested → HIT)
#   002-receipt.png  → HAO KOPITIAM, 3 items, total 55.000 (already ingested → HIT)
#   003-receipt.png  → AEON Pluit, 4 items, total 76.000  (FRESH, never run → MISS)
#
# NOTE: KIE01 is a one-shot cache-MISS — after the first run, 003 is cached and a
# re-run would report cache_hits=1. To re-measure a miss, add a brand-new image.

- id: KIE01-image-cache-miss
  category: kie_extraction
  title: Fresh image → cache MISS (003, never ingested)
  tags: [kie, image, cache_miss, single_turn]
  turns:
    - user: "Tolong proses struk ini dan beri tahu toko serta totalnya."
      attachment: sample-data/receipt/003-receipt.png
      note: "003 is fresh — first ingest, so cache_misses=1, cache_hits=0."
      expect:
        route: any
        cache_hits: 0
        cache_misses: 1
        content_any: ["aeon", "76", "total", "struk", "rp"]

- id: KIE02-image-cache-hit
  category: kie_extraction
  title: Previously-ingested image → cache HIT (002)
  tags: [kie, image, cache_hit, single_turn]
  turns:
    - user: "Proses struk ini, ringkas toko dan totalnya."
      attachment: sample-data/receipt/002-receipt.png
      note: "002 (HAO KOPITIAM) already ingested → cache_hits=1, cache_misses=0."
      expect:
        route: any
        cache_hits: 1
        cache_misses: 0
        content_any: ["hao kopitiam", "kwetiau", "55", "total"]

- id: KIE03-pdf-cache-hit
  category: kie_extraction
  title: Previously-ingested PDF → cache HIT (multi-page)
  tags: [kie, pdf, cache_hit, single_turn]
  turns:
    - user: "Proses PDF struk ini, ringkaskan isinya."
      attachment: sample-data/pdf/001-receipt.pdf
      note: "001-receipt.pdf already ingested → all pages cache hits."
      expect:
        route: any
        cache_misses: 0
        content_any: ["total", "halaman", "page", "struk", "rp"]

- id: KIE04-extract-then-write
  category: kie_extraction
  title: Extract a cached receipt then insert it into a sheet
  tags: [kie, image, write, mutating, multi_turn]
  mutating: true
  cleanup:
    - "Hapus baris terakhir dari sheet Jun."
  turns:
    - user: "Ini struk belanjaku, berapa totalnya?"
      attachment: sample-data/receipt/001-receipt.jpeg
      expect:
        route: any
        cache_hits: 1
        cache_misses: 0
        content_any: ["alfamidi", "10.800", "10800", "total"]
    - user: "Masukkan struk itu sebagai baris baru ke sheet Jun pakai tanggal hari ini."
      expect:
        route: data_entry_team
        content_any: ["alfamidi", "ditambahkan", "added", "berhasil", "udah", "sudah", "terupdate", "sheet Jun", "rangkuman total"]
        mcp_tools_any: [tool_append_rows, tool_update_cells]

- id: KIE05-multi-image-both-cached
  category: kie_extraction
  title: Two cached images in one turn → both extracted from cache
  tags: [kie, image, multi_image, cache_hit, single_turn]
  turns:
    - user: "Analisikan ini struk pembelianku, gimana?."
      attachments:
        - sample-data/receipt/001-receipt.jpeg
        - sample-data/receipt/002-receipt.png
      note: "Both already ingested → cache_hits=2, cache_misses=0."
      expect:
        route: any
        cache_hits: 2
        cache_misses: 0
        content_any: ["alfamidi", "hao kopitiam", "kwetiau", "total"]

- id: KIE06-receipt-create-sheet-then-write
  category: kie_extraction
  title: Receipt → create new month sheet "Jul" → write the row into it (compound)
  tags: [kie, image, write, create_sheet, mutating, single_turn]
  mutating: true
  cleanup:
    - "Hapus sheet Jul secara permanen, sudah saya konfirmasi."
    - "Hapus baris Juli dari sheet Rangkuman Total, sudah saya konfirmasi."
  turns:
    - user: "Masukkan ini, buatkan untuk sheet Juli."
      attachment: sample-data/receipt/004-receipt.png
      note: >
        Compound create-then-write. Sheet "Jul" does not exist, so the team must
        create it first (sheet_agent -> tool_create_sheet, title "Jul"), then read
        a sibling month for the header template and write the receipt row into Jul.
        004-receipt.png = CAARYAWAN 02 COFFEE, BEEF BULGOGI x1, total 35.000, CASH,
        02 Jul 2026 (label: sample-data/labels/images/004-receipt.json).
        Cache is intentionally NOT asserted here (this is a flow scenario, not a
        cache test). mcp_args_contains uses stable names (not amounts) so it does
        not depend on 35000-vs-35.000 formatting. The Rangkuman Total reconcile
        (append a "Juli" row) is expected but model-dependent, so it is exercised
        by cleanup rather than hard-gated, to keep this case stable at 100%.
      expect:
        route: data_entry_team
        mcp_tools_all: [tool_create_sheet]
        mcp_tools_any: [tool_get_multiple_sheet_data, tool_get_sheet_data]
        mcp_args_contains: ["jul", "beef bulgogi", "caaryawan"]
        content_any:
          ["jul", "juli", "beef bulgogi", "caaryawan", "35", "35000", "sudah", "udah",
           "berhasil", "tercatat", "ditambahkan", "dibuat"]
