# KIE / Extraction pipeline (real vLLM Qwen-3.5-4B-Klaudia, MOCK_KIE=false).
#   002-receipt.png → FRESH content, cache MISS (slower; first-time extraction)
#   001-receipt.pdf → previously seen, cache HIT (faster)
# 002 content is unknown, so we assert the pipeline ran (a store/total/receipt is
# surfaced) rather than specific values, and we record latency to compare hit/miss.

- id: KIE01-image-cache-miss
  category: kie_extraction
  title: Fresh image extraction (cache miss) — PNG
  tags: [kie, image, cache_miss, latency, single_turn]
  turns:
    - user: "Tolong proses struk ini dan beri tahu toko serta totalnya."
      attachment: sample-data/receipt/002-receipt.png
      note: "002-receipt.png is new — exercises a real KIE call, no cache."
      expect:
        route: any
        content_any: ["total", "toko", "store", "struk", "receipt", "rp"]
        latency_ms_max: 45000

- id: KIE02-pdf-cache-hit
  category: kie_extraction
  title: PDF extraction (cache hit) — multi-page
  tags: [kie, pdf, cache_hit, latency, single_turn]
  turns:
    - user: "Proses PDF struk ini, ringkas isinya."
      attachment: sample-data/pdf/001-receipt.pdf
      note: "001-receipt.pdf was seen before — should hit the dedup cache (faster)."
      expect:
        route: any
        content_any: ["total", "halaman", "page", "struk", "receipt", "rp"]
        latency_ms_max: 30000

- id: KIE03-extract-then-write
  category: kie_extraction
  title: Extract a receipt then insert it into a sheet (cross-pipeline)
  tags: [kie, image, write, mutating, multi_turn]
  mutating: true
  cleanup:
    - "Hapus baris terakhir dari sheet Jun."
  turns:
    - user: "Ini struk belanjaku, berapa totalnya?"
      attachment: sample-data/receipt/001-receipt.jpeg
      expect:
        route: any
        content_any: ["alfamidi", "pucuk", "10.800", "10800", "total"]
    - user: "Masukkan struk itu sebagai baris baru ke sheet Jun pakai tanggal hari ini."
      expect:
        route: data_entry_team
        content_any: ["alfamidi", "ditambahkan", "added", "berhasil", "✓"]
        mcp_tools_any: [tool_append_rows, tool_update_cells]

- id: KIE04-multi-image-upload
  category: kie_extraction
  title: Two images in one turn — both extracted
  tags: [kie, image, multi_image, single_turn]
  turns:
    - user: "Proses kedua struk ini sekaligus ya."
      attachments:
        - sample-data/receipt/001-receipt.jpeg
        - sample-data/receipt/002-receipt.png
      expect:
        route: any
        content_any: ["alfamidi", "total", "struk", "receipt", "2", "dua"]
        latency_ms_max: 60000
