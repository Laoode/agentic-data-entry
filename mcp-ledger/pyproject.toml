readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp==4.0.0b3",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
packages = ["ledger"]
