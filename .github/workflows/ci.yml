name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Ruff check
        run: uv run ruff check app/ klaudia/ config/ tests/

      - name: Ruff format check
        run: uv run ruff format --check app/ klaudia/ config/ tests/

  unit-test:
    name: Unit & Mock Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Run unit tests (no live API)
        env:
          USE_MOCK_OCR: "true"
          STAGE: development
          LLM_API_KEY: ""
          GROQ_API_KEY: ""
        run: |
          uv run pytest tests/integration/ocr/ tests/integration/agent/test_extraction.py -v --tb=short
