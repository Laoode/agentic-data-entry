[project]
name = "klaudia-protocol"
version = "0.1.0"
description = "Agentic Accountant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.133.0",
    "uvicorn>=0.27.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pillow>=10.0.0",
    "pypdfium2>=4.0.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "groq>=0.9.0",
    "openai>=1.54.0",
    "google-genai>=1.0.0",
    "python-multipart>=0.0.9",
    "klaudia",
    "mcp-archive",
    "mcp-gsheets",
    "mcp-ledger",
    "langfuse>=4.5.0",
    "langchain-google-vertexai>=3.2.3",
    "blake3>=1.0.0",
    "pillow-heif>=0.18.0",
    "json-repair>=0.30.0",
    "redis[hiredis]>=5.0.0",
    "aioboto3>=13.0.0",
    "taskiq>=0.11.0",
    "taskiq-redis>=1.0.0",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "slowapi>=0.1.10",
    "asyncpg>=0.31.0",
    "mem0ai==2.0.13",
    "psycopg[binary]>=3.3.4",
    "pgvector>=0.5.0",
    "psycopg-pool>=3.3.1",
]

[tool.uv.sources]
klaudia = { workspace = true }
mcp-archive = { workspace = true }
mcp-gsheets = { workspace = true }
mcp-ledger = { workspace = true }

[tool.uv.workspace]
members = [
    "mcp-gsheets",
    "klaudia",
    "mcp-archive",
    "mcp-ledger",
]

[tool.uv]
constraint-dependencies = ["fastmcp-slim==4.0.0b3"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
