[project]
name = "agentic-data-entry"
version = "0.1.0"
description = "Multi Agent Data Entry with MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pillow>=10.0.0",
    "pypdfium2>=4.0.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "groq>=0.9.0",
    "google-genai>=1.0.0",
    "python-multipart>=0.0.9",
    "klaudia",
    "mcp-sqlite",
    "mcp-gsheets",
    "langfuse>=4.5.0",
    "langchain-google-vertexai>=3.2.3",
    "blake3>=1.0.0",
    "pillow-heif>=0.18.0",
    "json-repair>=0.30.0",
    "redis[hiredis]>=5.0.0",
    "aioboto3>=13.0.0",
    "taskiq>=0.11.0",
    "taskiq-redis>=1.0.0",
]

[tool.uv.sources]
klaudia = { workspace = true }
mcp-sqlite = { workspace = true }
mcp-gsheets = { workspace = true }

[tool.uv.workspace]
members = [
    "mcp-gsheets",
    "klaudia",
    "mcp-sqlite",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
