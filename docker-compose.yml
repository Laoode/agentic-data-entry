# Local infra for Klaudia development: `docker compose up -d`
# Postgres is opt-in for the app (set DATABASE_URL); Redis + MinIO match the
# defaults in config/settings.py so no extra env is needed.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: klaudia
      POSTGRES_PASSWORD: klaudia
      POSTGRES_DB: klaudia
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klaudia"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional human grid UI over the ledger Postgres.
  # Start with: docker compose --profile ui up -d
  # Then add a data source in NocoDB pointing at postgres:5432/klaudia.
  nocodb:
    image: nocodb/nocodb:latest
    profiles: ["ui"]
    ports:
      - "8080:8080"
    volumes:
      - nocodb-data:/usr/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data:
  minio-data:
  nocodb-data:
